<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - L.D.P. Conocoto</title>
    <script src="https://cdn.tailwindcss.com"></script>
   <style>
        .bg-conocoto-blue { background-color: #001a4d; }
        .text-conocoto-gold { color: #FFD700; }
        #foto-preview { transform: scaleX(-1); }
        
        /* MAGIA DE IMPRESIÓN */
        @media print {
            body { 
                background-color: white; 
                margin: 0; 
                padding: 0; 
            }
            /* Escondemos el menú de navegación y todo el formulario */
            nav, .lg\:col-span-2, button { 
                display: none !important; 
            }
            /* Centramos el carnet en la hoja y le quitamos los bordes raros */
            #seccion-carnet { 
                display: block !important; 
                position: absolute; 
                top: 0; 
                left: 0; 
                width: 100%; 
                margin-top: 2cm;
            }
            #carnet-imprimible {
                margin: 0 auto;
                box-shadow: none !important; /* Quitamos sombras en papel */
                /* Aseguramos que los colores de fondo se impriman en Chrome */
                -webkit-print-color-adjust: exact; 
                print-color-adjust: exact;
            }
        }
    </style>
</head>
<body class="bg-gray-100 font-sans min-h-screen">

    <script>
        const usuarioSesion = JSON.parse(localStorage.getItem('usuario'));
        if (!usuarioSesion || usuarioSesion.rol !== 'Administrador') { window.location.href = "login.html"; }
    </script>

    <nav class="bg-conocoto-blue p-4 shadow-md text-white flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <span class="text-2xl">🛡️</span>
            <h1 class="text-xl font-bold">Panel de Administración</h1>
        </div>
        <button onclick="localStorage.removeItem('usuario'); window.location.href='login.html'" class="bg-red-600 px-4 py-2 rounded-lg text-sm">Cerrar Sesión</button>
    </nav>

    <main class="container mx-auto mt-8 px-4 grid grid-cols-1 lg:grid-cols-3 gap-8 pb-20">
        
        <div class="lg:col-span-2 bg-white p-8 rounded-2xl shadow-lg border border-gray-200">
            <h2 class="text-2xl font-black text-gray-800 mb-6 flex items-center">
                <span class="mr-2">📝</span> REGISTRO DE JUGADOR
            </h2>
            
            <form id="form-jugador" class="space-y-6">
                <div class="flex flex-col items-center space-y-4 bg-gray-50 p-4 rounded-xl border-2 border-dashed border-gray-300">
                    <video id="video" width="320" height="240" autoplay class="rounded-lg bg-black hidden"></video>
                    <canvas id="canvas" width="320" height="240" class="hidden"></canvas>
                    <img id="foto-resultado" class="rounded-lg shadow-md hidden" width="200">
                    
                    <div class="flex space-x-4">
                        <button type="button" id="btn-abrir-camara" class="bg-blue-600 text-white px-4 py-2 rounded-lg font-bold text-sm">📸 Abrir Cámara</button>
                        <button type="button" id="btn-capturar" class="bg-green-600 text-white px-4 py-2 rounded-lg font-bold text-sm hidden">🎯 Capturar Foto</button>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-bold text-gray-700">Cédula</label>
                        <input type="text" id="cedula" required maxlength="10" class="w-full p-2 border rounded-lg">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700">Seleccionar Equipo</label>
                        <select id="id_equipo" required class="w-full p-2 border rounded-lg bg-white">
                            <option value="">Cargando equipos...</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700">Nombres</label>
                        <input type="text" id="nombre" required class="w-full p-2 border rounded-lg">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700">Apellidos</label>
                        <input type="text" id="apellido" required class="w-full p-2 border rounded-lg">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-bold text-gray-700">Fecha de Nacimiento</label>
                        <input type="date" id="fecha_nacimiento" required class="w-full p-2 border rounded-lg">
                    </div>
                </div>

                <button type="submit" class="w-full bg-[#001a4d] text-white font-bold py-3 rounded-xl shadow-lg">FINALIZAR E IMPRIMIR CARNET</button>
            </form>
        </div>

        <div id="seccion-carnet" class="hidden">
            <div id="carnet-imprimible" class="bg-[#001a4d] w-[350px] h-[500px] rounded-2xl shadow-2xl relative overflow-hidden text-white mx-auto border-4 border-yellow-400">
                <div class="bg-white text-center py-4 text-blue-900 font-black text-xl">L.D.P. CONOCOTO</div>
                <div class="flex justify-center mt-6">
                    <img id="carnet-foto" src="" class="w-40 h-40 object-cover border-4 border-white rounded-lg">
                </div>
                <div class="p-6 text-center space-y-2">
                    <h3 id="carnet-nombre" class="text-2xl font-bold uppercase tracking-tighter">NOMBRE JUGADOR</h3>
                    <p id="carnet-equipo" class="text-yellow-400 font-bold">EQUIPO EJEMPLO</p>
                    <div class="pt-4 border-t border-blue-400">
                        <p class="text-xs">CÉDULA</p>
                        <p id="carnet-cedula" class="font-mono text-lg font-bold">1700000000</p>
                    </div>
                </div>
                <div class="absolute bottom-0 w-full bg-yellow-400 text-blue-900 text-center py-2 font-bold text-xs italic">SISTEMA OFICIAL DE REGISTRO - ISTER</div>
            </div>
            <button onclick="window.print()" class="w-full mt-6 bg-gray-800 text-white py-2 rounded-lg font-bold">🖨️ Imprimir Carnet</button>
        </div>
    </main>

    <script>
        let fotoBase64 = "";

        // 1. CARGAR EQUIPOS EN EL SELECT
        async function cargarEquiposEnMenu() {
            try {
                const res = await fetch('http://127.0.0.1:8000/equipos');
                const equipos = await res.json();
                const select = document.getElementById('id_equipo');
                select.innerHTML = '<option value="">-- Seleccione un Equipo --</option>';
                equipos.forEach(e => {
                    select.innerHTML += `<option value="${e.id}">${e.nombre} (${e.categoria})</option>`;
                });
            } catch (err) { console.error("Error cargando equipos", err); }
        }

        // 2. LÓGICA DE LA CÁMARA
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const btnAbrir = document.getElementById('btn-abrir-camara');
        const btnCapturar = document.getElementById('btn-capturar');
        const imgResultado = document.getElementById('foto-resultado');

        btnAbrir.addEventListener('click', async () => {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            video.srcObject = stream;
            video.classList.remove('hidden');
            btnCapturar.classList.remove('hidden');
            btnAbrir.classList.add('hidden');
        });

        btnCapturar.addEventListener('click', () => {
            const context = canvas.getContext('2d');
            context.drawImage(video, 0, 0, 320, 240);
            fotoBase64 = canvas.toDataURL('image/png'); // Convertimos la foto a texto
            imgResultado.src = fotoBase64;
            imgResultado.classList.remove('hidden');
            video.classList.add('hidden');
            btnCapturar.classList.add('hidden');
        });

        // 3. REGISTRO Y GENERACIÓN DE CARNET
        document.getElementById('form-jugador').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const payload = {
                cedula: document.getElementById('cedula').value,
                id_equipo: parseInt(document.getElementById('id_equipo').value),
                nombre: document.getElementById('nombre').value,
                apellido: document.getElementById('apellido').value,
                fecha_nacimiento: document.getElementById('fecha_nacimiento').value,
                url_foto: fotoBase64
            };

            try {
                const res = await fetch('http://127.0.0.1:8000/jugadores', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });

                // Leemos lo que nos responde Python (sea éxito o error)
                const datos = await res.json(); 

                if(res.ok) {
                    alert("¡" + datos.mensaje + "!"); // Muestra el mensaje de éxito del backend
                    
                    // Llenar datos del Carnet
                    document.getElementById('carnet-nombre').innerText = payload.nombre + " " + payload.apellido;
                    document.getElementById('carnet-cedula').innerText = payload.cedula;
                    document.getElementById('carnet-foto').src = fotoBase64;
                    document.getElementById('carnet-equipo').innerText = document.getElementById('id_equipo').options[document.getElementById('id_equipo').selectedIndex].text;
                    
                    document.getElementById('seccion-carnet').classList.remove('hidden');
                } else {
                    // Si hay un error (como cédula duplicada), lo mostramos
                    alert("❌ No se pudo guardar: " + datos.detail);
                }
            } catch (err) { 
                alert("Error crítico al conectar con el servidor."); 
            }
        });

        cargarEquiposEnMenu();
    </script>
</body>
</html>
